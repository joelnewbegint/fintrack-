    <!-- Google Fonts: Poppins (English) + Noto Sans Tamil (Tamil) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Register Progressive Web App Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('VK BANKER\'S Service Worker active with scope:', reg.scope);
              reg.onupdatefound = function() {
                var installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = function() {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New VK BANKER\'S update available.');
                    }
                  };
                }
              };
            })
            .catch(function(err) {
              console.warn('Service Worker registration skipped:', err);
            });
        });
      }
    </script>
