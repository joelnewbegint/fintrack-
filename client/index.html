<!DOCTYPE html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0EA5E9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VK BANKER'S" />
    <meta name="application-name" content="VK BANKER'S" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>VK BANKER'S & FINANCE | தவணை நிதி மேலாண்மை</title>
    <!-- Google Fonts: Poppins (English) + Noto Sans Tamil (Tamil) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // 1. Vite Stale Chunk Auto-Reload Handler
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('Vite preload error detected. Auto-reloading with latest bundle...');
        window.location.reload(true);
      });

      // 2. Register Progressive Web App Service Worker with Safe Update Detection
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              // Check for SW update immediately on page visit
              reg.update();
              reg.onupdatefound = function() {
                var installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = function() {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New VK BANKER\'S update installed.');
                    }
                  };
                }
              };
            })
            .catch(function(err) {
              console.warn('Service Worker registration skipped:', err);
            });
        });
      }
    </script>
  </head>
  <body class="antialiased selection:bg-sky-500 selection:text-white bg-slate-900 text-slate-100">
    <div id="root">
      <!-- Instant Splash Fallback: Never shows an empty blank screen -->
      <div id="initial-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;padding:20px;text-align:center;">
        <div style="width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#0284c7,#f59e0b);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(14,165,233,0.3);margin-bottom:16px;">
          <img src="/icon-192.png" alt="VK Banker's" style="width:44px;height:44px;object-fit:contain;border-radius:12px;" />
        </div>
        <h2 style="font-size:18px;font-weight:900;letter-spacing:-0.5px;margin:0 0 4px 0;color:#ffffff;">VK BANKER'S & FINANCE</h2>
        <p style="font-size:12px;font-weight:600;color:#38bdf8;margin:0 0 20px 0;">வி.கே. பேங்கர்ஸ் & பைனான்ஸ்</p>
        <div style="width:36px;height:36px;border:3px solid rgba(56,189,248,0.25);border-top-color:#38bdf8;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>

    <!-- Self-Healing Watchdog: If React hasn't mounted after 2.5s, auto-heal stale caches -->
    <script>
      setTimeout(function() {
        var loader = document.getElementById('initial-loader');
        if (loader && loader.parentElement) {
          console.warn('React taking longer than 2.5s or stale cache encountered. Triggering self-healing...');
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
          if (!sessionStorage.getItem('vk_recovered_once')) {
            sessionStorage.setItem('vk_recovered_once', '1');
            window.location.reload(true);
          } else {
            // If already reloaded once and still not loading, show manual reload button
            loader.innerHTML = `
              <div style="width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#0284c7,#f59e0b);display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
                <img src="/icon-192.png" alt="VK Banker's" style="width:44px;height:44px;object-fit:contain;border-radius:12px;" />
              </div>
              <h2 style="font-size:18px;font-weight:900;margin:0 0 6px 0;color:#ffffff;">VK BANKER'S & FINANCE</h2>
              <p style="font-size:12px;color:#94a3b8;margin:0 0 18px 0;">New update ready / புதுப்பித்தல் தேவை</p>
              <button onclick="localStorage.clear();sessionStorage.clear();if('caches' in window){caches.keys().then(k=>k.forEach(n=>caches.delete(n)))};window.location.reload(true);" style="background:#0284c7;color:#ffffff;border:none;padding:12px 24px;border-radius:14px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(2,132,199,0.4);">
                Refresh App / பக்கத்தை புதுப்பிக்கவும்
              </button>
            `;
          }
        }
      }, 2500);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
