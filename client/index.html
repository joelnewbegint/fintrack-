<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0EA5E9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VK BANKER'S" />
    <meta name="application-name" content="VK BANKER'S" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>VK BANKER'S & FINANCE | தவணை நிதி மேலாண்மை</title>
    <!-- Google Fonts: Poppins (English) + Noto Sans Tamil (Tamil) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Vite Stale Chunk Auto-Reload Handler
      window.addEventListener('vite:preloadError', function() {
        window.location.reload();
      });

      // Register Progressive Web App Service Worker with Auto-Update Poller
      if ('serviceWorker' in navigator) {
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            console.log('🔄 New app version detected! Reloading to activate latest code...');
            window.location.reload();
          }
        });

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('VK BANKER\'S Service Worker active with scope:', reg.scope);

              // 1. Check for updates immediately on startup
              reg.update();

              // 2. Automatically check for updates whenever user returns to or focuses the app
              document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                  reg.update();
                }
              });
              window.addEventListener('focus', function() {
                reg.update();
              });
              window.addEventListener('online', function() {
                reg.update();
              });

              // 3. Periodically check for updates every 10 minutes
              setInterval(function() {
                reg.update();
              }, 10 * 60 * 1000);

              // 4. If a new version is waiting, activate it immediately
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }

              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('⚡ New update ready! Activating...');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(function(err) {
              console.warn('Service Worker registration notice:', err);
            });
        });
      }
    </script>
  </head>
  <body class="antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
