<!DOCTYPE html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | VK BANKER'S</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 24px;
        padding: 32px 24px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .logo {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        margin: 0 auto 20px;
        box-shadow: 0 8px 24px rgba(14, 165, 233, 0.25);
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 8px;
        color: #38bdf8;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .tamil {
        font-size: 12px;
        color: #cbd5e1;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px 20px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0ea5e9, #0284c7);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="VK Banker's" class="logo" />
      <h1>VK BANKER'S & FINANCE</h1>
      <p>You are currently offline. Please check your internet connection to sync live financial records and perform transactions.</p>
      <p class="tamil">நீங்கள் இணைய தொடர்பில் இல்லை. நேரலை நிதி விவரங்களை புதுப்பிக்க இணைய இணைப்பை சரிபார்க்கவும்.</p>
      <button class="btn" onclick="window.location.reload()">Retry Connection / மீண்டும் முயற்சி</button>
    </div>
  </body>
</html>
