services:
  - type: web
    name: fintrack-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        value: fintrack_super_secure_jwt_secret_key_2026_tamilnadu_finance
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://vk-banker.web.app
      - key: WHATSAPP_NUMBER
        value: 919842112345

